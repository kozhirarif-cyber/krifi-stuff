<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f1ea">
  <title>Lavazza Coffee</title>
  <style>
    :root {
      color-scheme: light;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #2a1d16;
      background: #f6f1ea;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 32px 18px;
    }

    main {
      width: min(100%, 560px);
      padding: 36px;
      border: 1px solid #e6dccf;
      border-radius: 20px;
      background: #fff;
      box-shadow: 0 6px 24px rgba(60, 35, 20, .08);
    }

    h1 {
      margin: 0;
      color: #5a3420;
      font-size: clamp(28px, 6vw, 38px);
      line-height: 1.15;
    }

    p {
      margin: 10px 0 26px;
      color: #7a6a5f;
    }

    nav {
      display: grid;
      gap: 12px;
    }

    .page-link {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      padding: 16px 18px;
      border: 1px solid #e6dccf;
      border-radius: 12px;
      color: #5a3420;
      font-weight: 650;
      text-decoration: none;
      transition: border-color .15s, background-color .15s, transform .15s;
    }

    .page-link::after {
      content: "→";
      color: #b4532a;
      font-size: 20px;
    }

    .page-link:hover {
      transform: translateY(-1px);
      border-color: #b4532a;
      background: #fdfaf7;
    }

    .page-link:focus-visible {
      outline: 3px solid #b4532a;
      outline-offset: 3px;
    }

    @media (max-width: 480px) {
      main {
        padding: 26px 20px;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>Lavazza Coffee</h1>
    <p>Explore the pages in this collection.</p>
    <nav aria-label="Site pages">
      <!-- Add another page by copying a link and updating its label and URL. -->
      <a class="page-link" href="coffee-price-gallery-2026.html">Coffee Price Gallery 2026</a>
    </nav>
  </main>
</body>
</html>
